name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Setup Python (vision pack)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache vision pack
        id: vision-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/vision/runtime
            src-tauri/vision/models
            src-tauri/vision/LICENSES.txt
          key: vision-pack-${{ hashFiles('tools/vision/*.py') }}

      - name: Build vision pack (ONNX Runtime + OpenVINO + models)
        if: steps.vision-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.22.1 onnx onnxscript numpy onnxruntime==1.24.1
          python tools/vision/fetch-vision.py --platform win --out src-tauri/vision

      - name: Vision engine self-test (OpenVINO must start, models must run)
        shell: bash
        working-directory: src-tauri
        env:
          DECARGO_VISION_DIR: ${{ github.workspace }}/src-tauri/vision
          DECARGO_EXPECT_OPENVINO: '1'
        run: cargo test --release --target x86_64-pc-windows-msvc vision -- --nocapture

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: spica-tide-windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig
