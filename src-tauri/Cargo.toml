[package]
name = "spica-tide"
version = "3.42.1"
description = "SPICA TIDE — Deck Cargo Planning Tool for PSV SPICA TIDE"
authors = ["Pavlo Lagutin"]
license = "Proprietary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.10", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "~2.5"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ed25519-dalek = "2"
base64 = "0.22"
# v3.41 — native vision engine (ONNX Runtime loaded at run time from vision/runtime)
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "std", "api-24", "openvino"] }
